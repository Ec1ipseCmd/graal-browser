name: graal-browser
services:
  client:
    build: ./browser
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://graal.example.com}
    ports:
      - "127.0.0.1:${GRAAL_PORT:-4173}:4173"
    volumes:
      - ./browser/.cache/public-assets:/app/.cache/public-assets
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    user: "1000:1000"
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes:
      - ./deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./browser/.cache/cloudflared/tunnel.json:/etc/cloudflared/tunnel.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      client:
        condition: service_healthy
