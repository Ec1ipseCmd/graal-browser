<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graal Online</title>
  <link rel="icon" href="/favicon.svg?v=graal">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="player" aria-label="Graal game session">
      <div class="toolbar"><div class="brand"><span>Graal Online</span><span id="presence" role="status" title="Browser profiles with this website open in the last 2 minutes. Multiple tabs count once; includes loading and idle clients, not just logged-in players.">Counting browsers…</span></div><div><label class="auto-join"><input id="auto-join" type="checkbox"> Auto join Kingdoms</label><button id="reload">Reload</button><button id="fullscreen">Full screen</button><a href="https://github.com/Ec1ipseCmd/graal-browser" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">GitHub</a></div></div>
      <div id="screen"></div>
      <span id="auto-join-status" class="sr-only" role="status" aria-live="polite"></span>
      <span id="status" class="sr-only" role="status" aria-live="polite">Loading Graal…</span>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
